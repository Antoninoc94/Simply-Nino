<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Scoreboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="top-bar">
    <!-- MENU -->
    <nav>
      <button class="menu-button active" onclick="showSection('live', this)">
        <i class="fas fa-bolt" style="margin-right: 6px;"></i>LIVE
      </button>
      <button class="menu-button" onclick="showSection('history', this)">
        <i class="fas fa-history" style="margin-right: 6px;"></i>HISTORY
      </button>
    </nav>

    <div class="now-playing">
      <div class="label">NOW PLAYING</div>
      <h2 id="songTitle">---</h2>
      <div class="artist" id="songArtist">---</div>
    </div>
  </div>

  <!-- SEZIONE LIVE -->
  <section id="liveSection">
    <div class="container" id="playersContainer">
      <div class="empty-state">In attesa di dati dal gioco…</div>
    </div>
  </section>

  <!-- SEZIONE HISTORY -->
  <section id="historySection" style="display: none;">
    <div class="container history-list" id="historyContainer">
      <div class="empty-state">Nessun dato storico disponibile.</div>
    </div>
  </section>

  <!-- DETTAGLIO SCORE -->
  <div class="modal-overlay" id="detailModal" style="display: none;" onclick="if(event.target===this) closeDetail()">
    <div class="modal-panel">
      <button class="modal-close" onclick="closeDetail()">✕</button>

      <div class="modal-header">
        <div>
          <div class="modal-song" id="detailSong">---</div>
          <div class="modal-artist" id="detailArtist">---</div>
        </div>
        <div class="modal-score-block">
          <div class="modal-score" id="detailScore">--.--%</div>
          <div class="modal-player" id="detailPlayer">---</div>
        </div>
      </div>

      <div id="detailBody">
        <div class="detail-columns">
          <div class="detail-side">
            <div class="detail-panel">
              <div class="detail-panel-title">Judgments</div>
              <div id="detailJudgments"></div>
            </div>
            <div class="detail-panel">
              <div class="detail-panel-title">Radar Data</div>
              <div id="detailRadar"></div>
            </div>
          </div>

          <div class="detail-main">
            <div class="detail-panel">
              <div class="detail-panel-title">Timing Chart</div>
              <div class="stat-tiles" id="detailStats"></div>
              <div class="chart-wrap">
                <canvas id="detailChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="empty-state" id="detailEmpty" style="display: none;">Dettaglio non disponibile per questa partita.</div>
    </div>
  </div>

  <script>
    const medals = ["🥇", "🥈", "🥉"];

    function rankBadge(index) {
      return medals[index]
        ? `<span class="rank-badge medal">${medals[index]}</span>`
        : `<span class="rank-badge">${index + 1}</span>`;
    }

    function judgmentChips(player) {
      let stats = "";
      if (player.FAPlus > 0) stats += `<span class="chip FAP">${player.FAPlus} FA+</span>`;
      if (player.Fantastic > 0) stats += `<span class="chip FA${player.FAPlus > 0 ? ' faplus-active' : ''}">${player.Fantastic} FA</span>`;
      if (player.Excellent > 0) stats += `<span class="chip EX">${player.Excellent} EX</span>`;
      if (player.Great > 0) stats += `<span class="chip GR">${player.Great} GR</span>`;
      if (player.Decent > 0) stats += `<span class="chip DC">${player.Decent} DE</span>`;
      if (player.WayOff > 0) stats += `<span class="chip WO">${player.WayOff} WO</span>`;
      if (player.Miss > 0) stats += `<span class="chip MS">${player.Miss} MISS</span>`;
      return stats;
    }

    function showSection(section, button) {
      document.getElementById('liveSection').style.display = section === 'live' ? 'block' : 'none';
      document.getElementById('historySection').style.display = section === 'history' ? 'block' : 'none';

      document.querySelectorAll('.menu-button').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');

      if (section === 'history') loadHistory();
    }

    function loadHistory() {
      const container = document.getElementById("historyContainer");
      fetch('/history')
        .then(res => res.json())
        .then(entries => {
          if (!Array.isArray(entries) || entries.length === 0) {
            container.innerHTML = '<div class="empty-state">Nessun dato storico disponibile.</div>';
            return;
          }

          container.innerHTML = entries.slice().reverse().map(entry => {
            const players = Object.keys(entry)
              .filter(key => key.startsWith("P"))
              .map(key => ({ key, player: entry[key] }))
              .sort((a, b) => (b.player.PunteggioITG || 0) - (a.player.PunteggioITG || 0));

            const playersHtml = players.map(({ key, player }, index) => {
              const meta = {
                id: entry.Id, key,
                song: entry.SongTitle, artist: entry.SongArtist, date: entry.DateTime,
                name: player.PlayerName || '???', score: player.PunteggioITG || 0,
                judgments: {
                  FAPlus: player.FAPlus || 0, Fantastic: player.Fantastic || 0,
                  Excellent: player.Excellent || 0, Great: player.Great || 0,
                  Decent: player.Decent || 0, WayOff: player.WayOff || 0, Miss: player.Miss || 0,
                  Holds: player.Holds, HoldsTotal: player.HoldsTotal,
                  Rolls: player.Rolls, RollsTotal: player.RollsTotal,
                  Mines: player.Mines, MinesTotal: player.MinesTotal,
                },
              };
              const clickAttrs = entry.Id
                ? `class="history-player clickable" data-detail="${encodeURIComponent(JSON.stringify(meta))}" onclick="openDetail(this)"`
                : `class="history-player"`;

              return `
                <div ${clickAttrs}>
                  <div class="history-player-id">
                    ${rankBadge(index)}
                    <span class="player-name">${player.PlayerName || '???'}</span>
                    <span class="itg-score small">${(player.PunteggioITG || 0).toFixed(2)}%</span>
                    ${entry.Id ? '<i class="fas fa-chart-line detail-hint"></i>' : ''}
                  </div>
                  <div class="stats">${judgmentChips(player)}</div>
                </div>
              `;
            }).join("");

            return `
              <div class="history-entry">
                <div class="history-meta">
                  <span class="history-date">${entry.DateTime || ''}</span>
                  <span class="history-song">${entry.SongTitle} <span class="history-artist">— ${entry.SongArtist}</span></span>
                </div>
                <div class="history-players">${playersHtml}</div>
              </div>
            `;
          }).join("");
        })
        .catch(err => {
          console.error('Errore nel caricamento della history:', err);
          container.innerHTML = '<div class="empty-state">Impossibile caricare la history.</div>';
        });
    }

    // ---------------------------------------------------------------
    // Dettaglio score (modale con Judgments / Radar Data / Timing Chart)
    // ---------------------------------------------------------------

    let detailChartInstance = null;

    function judgmentRows(j) {
      const rows = [
        ['FAP', 'Fantastic (FA+)', j.FAPlus],
        ['FA', 'Fantastic', j.Fantastic],
        ['EX', 'Excellent', j.Excellent],
        ['GR', 'Great', j.Great],
        ['DC', 'Decent', j.Decent],
        ['WO', 'Way Off', j.WayOff],
        ['MS', 'Miss', j.Miss],
      ];
      return rows.map(([cls, label, count]) => `
        <div class="judgment-row">
          <span class="judgment-label ${cls}">${label}</span>
          <span class="judgment-count">${count || 0}</span>
        </div>
      `).join('');
    }

    function radarRows(j) {
      const rows = [];
      if (j.HoldsTotal != null) rows.push(['Holds Held', j.Holds, j.HoldsTotal]);
      if (j.RollsTotal != null) rows.push(['Rolls Hit', j.Rolls, j.RollsTotal]);
      if (j.MinesTotal != null) rows.push(['Mines Avoided', j.Mines, j.MinesTotal]);
      if (rows.length === 0) return '<div class="empty-state" style="padding:16px;">N/D</div>';
      return rows.map(([label, val, total]) => `
        <div class="radar-row">
          <span>${label}</span>
          <span>${val || 0}/${total || 0}</span>
        </div>
      `).join('');
    }

    function renderStatTiles(stats) {
      const s = stats || { MeanAbsError: 0, MeanOffset: 0, StdDev3: 0, MaxError: 0 };
      document.getElementById('detailStats').innerHTML = `
        <div class="stat-tile">
          <div class="stat-label">Mean Absolute Error</div>
          <div class="stat-value">${s.MeanAbsError.toFixed(2)} ms</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Mean Offset</div>
          <div class="stat-value">${s.MeanOffset >= 0 ? '+' : ''}${s.MeanOffset.toFixed(2)} ms</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">3&times; Std Dev</div>
          <div class="stat-value">${s.StdDev3.toFixed(2)} ms</div>
        </div>
        <div class="stat-tile">
          <div class="stat-label">Max Error</div>
          <div class="stat-value">${s.MaxError.toFixed(2)} ms</div>
        </div>
      `;
    }

    function renderTimingChart(offsets, life, stats) {
      const ctx = document.getElementById('detailChart').getContext('2d');
      if (detailChartInstance) detailChartInstance.destroy();

      const hasFAPlus = offsets.some(p => p.tns === 'FAPlus');
      const colors = {
        FAPlus: '#21cce8',
        Fantastic: hasFAPlus ? '#ffffff' : '#21cce8',
        Excellent: '#e29c18',
        Great: '#66c955',
        Decent: '#b45cff',
        WayOff: '#c9855e',
        Miss: '#ff3030',
      };
      const tnsOrder = ['FAPlus', 'Fantastic', 'Excellent', 'Great', 'Decent', 'WayOff', 'Miss'];
      const maxAbs = Math.max(50, Math.ceil((((stats && stats.MaxError) || 50) * 1.15) / 10) * 10);

      const scatterDatasets = tnsOrder.map(tns => ({
        type: 'scatter',
        label: tns === 'FAPlus' ? 'FA+' : tns,
        data: offsets
          .filter(p => p.tns === tns)
          .map(p => ({ x: p.t, y: tns === 'Miss' ? -maxAbs : p.ms })),
        backgroundColor: colors[tns],
        pointRadius: tns === 'Miss' ? 2 : 2.5,
        yAxisID: 'y',
        order: 1,
      })).filter(ds => ds.data.length > 0);

      const datasets = scatterDatasets;
      if (life && life.length > 0) {
        datasets.unshift({
          type: 'line',
          label: 'Life',
          data: life.map(p => ({ x: p.t, y: p.life * 100 })),
          borderColor: 'rgba(255,255,255,0.9)',
          backgroundColor: 'rgba(255,255,255,0.08)',
          borderWidth: 1.5,
          pointRadius: 0,
          fill: true,
          tension: 0.15,
          yAxisID: 'y1',
          order: 2,
        });
      }

      detailChartInstance = new Chart(ctx, {
        type: 'scatter',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: { labels: { color: '#8891b3', font: { family: 'Rajdhani', size: 11 }, boxWidth: 10 } },
            tooltip: {
              callbacks: {
                label: (item) => item.dataset.label === 'Life'
                  ? `Life: ${item.parsed.y.toFixed(0)}%`
                  : `${item.dataset.label}: ${item.parsed.y.toFixed(1)} ms @ ${item.parsed.x.toFixed(1)}s`,
              },
            },
          },
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'Time (s)', color: '#8891b3' },
              ticks: { color: '#8891b3' },
              grid: { color: 'rgba(255,255,255,0.05)' },
            },
            y: {
              position: 'left',
              min: -maxAbs,
              max: maxAbs,
              title: { display: true, text: 'Offset (ms)', color: '#8891b3' },
              ticks: { color: '#8891b3' },
              grid: { color: 'rgba(255,255,255,0.06)' },
            },
            y1: {
              position: 'right',
              min: 0,
              max: 100,
              title: { display: true, text: 'Life (%)', color: '#8891b3' },
              ticks: { color: '#8891b3' },
              grid: { display: false },
            },
          },
        },
      });
    }

    function openDetail(el) {
      const meta = JSON.parse(decodeURIComponent(el.dataset.detail));
      const modal = document.getElementById('detailModal');
      const body = document.getElementById('detailBody');
      const empty = document.getElementById('detailEmpty');

      document.getElementById('detailSong').textContent = meta.song;
      document.getElementById('detailArtist').textContent = meta.artist;
      document.getElementById('detailScore').textContent = meta.score.toFixed(2) + '%';
      document.getElementById('detailPlayer').textContent = `${meta.name} · ${meta.date}`;
      document.getElementById('detailJudgments').innerHTML = judgmentRows(meta.judgments);
      document.getElementById('detailRadar').innerHTML = radarRows(meta.judgments);

      body.style.display = 'none';
      empty.style.display = 'none';
      modal.style.display = 'flex';

      fetch(`/history/${meta.id}`)
        .then(res => { if (!res.ok) throw new Error('not ok'); return res.json(); })
        .then(data => {
          const detail = data[meta.key];
          if (!detail || !Array.isArray(detail.Offsets) || detail.Offsets.length === 0) {
            empty.style.display = 'block';
            return;
          }
          body.style.display = 'block';
          renderStatTiles(detail.Stats);
          renderTimingChart(detail.Offsets, detail.Life, detail.Stats);
        })
        .catch(err => {
          console.error('Errore nel caricamento del dettaglio:', err);
          empty.style.display = 'block';
        });
    }

    function closeDetail() {
      document.getElementById('detailModal').style.display = 'none';
    }

    const socket = new WebSocket('ws://localhost:8081');

    socket.onmessage = function(event) {
      const data = JSON.parse(event.data);
      document.getElementById('songTitle').textContent = data.SongTitle;
      document.getElementById('songArtist').textContent = data.SongArtist;

      const players = [];

      for (const key in data) {
        if (key.startsWith("P")) {
          players.push(data[key]);
        }
      }

      players.sort((a, b) => (b.PunteggioITG || 0) - (a.PunteggioITG || 0));

      const container = document.getElementById("playersContainer");
      container.innerHTML = "";

      players.forEach((player, index) => {
        const life = Math.max(0, Math.min(100, Math.round((player.Life || 0) * 100)));
        const critical = (player.Life || 0) <= 0.2;
        const lifeState = life <= 20 ? "critical" : life <= 50 ? "warn" : "ok";

        container.innerHTML += `
          <div class="player-card ${index === 0 ? 'first-place' : ''} ${critical ? 'critical' : ''}">
            <div class="player-header">
              <div class="player-id">
                ${rankBadge(index)}
                <div class="player-name">${player.PlayerName || '???'}</div>
              </div>
              <div class="itg-score">${(player.PunteggioITG || 0).toFixed(2)}%</div>
            </div>
            <div class="stats">${judgmentChips(player)}</div>
            <div class="life-bar">
              <div class="life-fill ${lifeState}" style="width: ${life}%;"></div>
              <div class="life-label">${life}%</div>
            </div>
          </div>
        `;
      });

      if (players.length === 0) {
        container.innerHTML = '<div class="empty-state">In attesa di dati dal gioco…</div>';
      }
    };
  </script>
</body>
</html>
